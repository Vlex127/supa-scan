name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege for all jobs; the scan here is a build-and-gate step and needs
# no token permissions beyond reading the repo. No `pull_request_target`, no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint · typecheck · test · scan secure fixture
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Enable Corepack (installs pnpm from packageManager)
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm --version

      - name: Install dependencies (frozen, no build scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm run lint

      # Next generates route/layout types (e.g. LayoutProps) into .next/types on
      # build. A clean CI checkout has no .next/, so tsc --noEmit would fail on
      # those references. `next typegen` produces them without a full build.
      - name: Generate Next.js route types
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build CLI
        run: pnpm run build:cli

      - name: Scan the secure fixture (must be clean)
        run: node dist/cli/bin.js fixtures/secure --fail-on info
