version: 2
updates:
  # Keep the SHA-pinned third-party Actions up to date. Dependabot opens a PR
  # when a new release is cut; the human still reviews the tag→commit mapping.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"
    open-pull-requests-limit: 5
